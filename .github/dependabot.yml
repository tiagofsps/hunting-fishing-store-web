version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - msw
          - jsdom
      tooling:
        patterns:
          - vite
          - typescript
          - eslint
          - '@typescript-eslint/*'
          - tailwindcss
          - '@tailwindcss/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
