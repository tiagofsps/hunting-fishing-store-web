version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates are disabled to keep the PR list clean; security updates
    # still open automatically.
    open-pull-requests-limit: 0
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - msw
          - jsdom
      tooling:
        patterns:
          - vite
          - typescript
          - eslint
          - '@typescript-eslint/*'
          - tailwindcss
          - '@tailwindcss/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
